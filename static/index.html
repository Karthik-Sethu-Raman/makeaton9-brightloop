<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadence — recurring billing</title>
  <meta name="description" content="Cadence — run plans, subscriptions and recurring billing in one place.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/frontend/styles/tokens.css">
  <link rel="stylesheet" href="/frontend/styles/layout.css">
</head>
<body>
  <!-- T45: first focusable element — keyboard users skip the sidebar nav -->
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="cad-shell">

    <aside class="cad-sidebar">
      <div class="cad-brand">
        <!-- Cadence mark: 20px copper ring, filled dot on the rim at the
             two-o'clock tick (a billing cycle caught mid-turn). Plain SVG,
             colors via tokens in layout.css. -->
        <svg class="cad-mark" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <circle class="cad-mark-ring" cx="10" cy="10" r="8"></circle>
          <circle class="cad-mark-dot" cx="16.9" cy="6" r="2.2"></circle>
        </svg>
        <span class="cad-wordmark">Cadence</span>
      </div>
      <div class="cad-scope">Internal workspace</div>

      <!-- T37 phone fold: DESIGN sanctions "48px top bar w/ menu sheet" for a
           7-destination nav (bottom nav is capped at 5). The checkbox drives
           the sheet from pure CSS (#cad-navtoggle:checked ~ .cad-nav in
           layout.css); the label is the Menu hit area, shown only <=720px.
           Input sits BEFORE the nav so the sibling selector can reach it. -->
      <input type="checkbox" id="cad-navtoggle" class="cad-navtoggle" aria-label="Open navigation menu">
      <label for="cad-navtoggle" class="cad-menubtn" role="button" tabindex="0"
             aria-controls="nav" aria-expanded="false">Menu</label>

      <!-- T06 (Saurabh): hash router fills this nav and applies .is-active. -->
      <nav class="cad-nav" id="nav" aria-label="Primary"></nav>
    </aside>

    <main class="cad-main" id="main">
      <!-- T06 mounts page modules (render(mount) -> cleanup()) into #view
           and replaces this placeholder on first navigation. -->
      <div class="cad-boot" id="view">
        <noscript>Cadence needs JavaScript to run — the demo requires it.</noscript>
      </div>
    </main>

  </div>

  <!-- T37: close the phone menu sheet the moment a nav tap navigates (pure-CSS
       toggle otherwise stays open after same-page taps).
       T51 a11y: aria-expanded sync, Esc-to-close with focus returned to the
       toggle, and a Tab trap while the sheet is open (a pure-checkbox sheet is
       invisible to Esc/keyboard otherwise). Focus stays on the chosen nav item
       after navigation — only Esc-close returns focus to the toggle. -->
  <script>
    (function () {
      var toggle = document.getElementById('cad-navtoggle');
      var label = document.querySelector('.cad-menubtn');
      if (!toggle || !label) return;

      function setExpanded(open) {
        toggle.checked = open;
        label.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      toggle.addEventListener('change', function () { setExpanded(toggle.checked); });

      // label[tabindex] gets keyboard activation like a button
      label.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          toggle.checked = !toggle.checked;
          setExpanded(toggle.checked);
        }
      });

      document.addEventListener('keydown', function (e) {
        if (!toggle.checked) return;
        var aside = document.querySelector('.cad-sidebar');
        if (e.key === 'Escape') {
          setExpanded(false);
          toggle.focus(); // focus returns to the toggle on Esc-close
        } else if (e.key === 'Tab' && aside) {
          // trap: cycle Tab within the open sheet (menubtn + nav items)
          var f = [].filter.call(
            aside.querySelectorAll('.cad-menubtn, .cad-navitem, .cad-navtoggle'),
            function (el) { return el.offsetParent !== null || el === toggle; }
          );
          if (!f.length) return;
          var first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });
    })();
  </script>

  <!-- Boot the SPA: router fills #nav and mounts page modules into #view.
       Module script = deferred, runs after the DOM above exists. -->
  <script type="module" src="/frontend/pages/router.js"></script>
</body>
</html>
