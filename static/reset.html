<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password reset — Cadence</title>
  <meta name="description" content="Reset your Cadence password — request a reset link and set a new one.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/frontend/styles/tokens.css">
  <link rel="stylesheet" href="/frontend/styles/layout.css">
</head>
<body>
  <!-- T33 (Avanthik): forgot-password / reset page. Standalone (no sidebar: zero nav
       destinations — DESIGN shell rule "no sidebar if ≤5 destinations"). Two modes:
       no ?token=  -> ask for the account email, POST /api/auth/forgot, show the reset
                      link in the response (no mail server in the demo — statement's
                      "reset link should arrive at their registered email" becomes a
                      link shown in the UI response, per task line);
       ?token=...  -> choose a new password, POST /api/auth/reset.

       API CONTRACT for T08 (Karthik) — mirrors validators.js messages:
         POST /api/auth/forgot  {email}                     (client validates email first)
           -> 200 {"ok": true,  "reset_url": "/reset.html?token=<token>"}
                (server ALSO logs reset_url to stdout — the task line's "response/log"
                 second demo channel)
           -> 404 {"detail": "No account uses that email."}
         POST /api/auth/reset   {token, password}           (client validates policy first)
           -> 200 {"ok": true}
           -> 400 {"detail": <MSG.password from validators.js>}   // policy, mirrored
           -> 404 {"detail": "That reset link has expired. Request a new one."}
       Until T08 lands this page correctly shows its error state with Retry. -->

  <main class="auth-shell">
    <div class="auth-brand">
      <svg class="cad-mark" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <circle class="cad-mark-ring" cx="10" cy="10" r="8"></circle>
        <circle class="cad-mark-dot" cx="16.9" cy="6" r="2.2"></circle>
      </svg>
      <span class="cad-wordmark">Cadence</span>
    </div>

    <section class="auth-card">
      <h1 class="auth-h1" id="heading">Password reset</h1>
      <p class="auth-lede" id="lede">Enter your account email and we will generate a reset link.</p>

      <form id="forgot-form" class="auth-form" novalidate>
        <div class="cad-field">
          <label class="cad-label" for="email">Email</label>
          <input class="cad-input" type="email" id="email" name="email" autocomplete="email">
        </div>
        <button class="cad-btn-primary" type="submit" id="forgot-submit">Send reset link</button>
      </form>

      <form id="reset-form" class="auth-form" hidden novalidate>
        <div class="cad-field">
          <label class="cad-label" for="password">New password</label>
          <input class="cad-input" type="password" id="password" name="password"
                 autocomplete="new-password">
        </div>
        <button class="cad-btn-primary" type="submit" id="reset-submit">Set new password</button>
      </form>

      <div class="auth-result" id="result" aria-live="polite"></div>
    </section>
  </main>

  <script>
    // Pre-paint mode toggle (synchronous, non-module): the ?token= visitor must never
    // see the email form flash while the module script loads over the network.
    if (new URLSearchParams(location.search).get('token')) {
      document.getElementById('forgot-form').hidden = true;
      document.getElementById('reset-form').hidden = false;
      document.getElementById('heading').textContent = 'New password';
      document.getElementById('lede').textContent = 'Set a new password for your account. It must follow the password policy.';
    }
  </script>

  <script type="module">
    import { attachBlurError, validateForm, MSG } from '/frontend/validation/validators.js';

    const token = new URLSearchParams(location.search).get('token');
    const forgotForm = document.getElementById('forgot-form');
    const resetForm = document.getElementById('reset-form');
    const result = document.getElementById('result');

    // DESIGN states: keep the frame, one sentence, no banners. Errors render inside
    // the card; Retry (page reload) ONLY for transient/network failures — a server
    // detail (bad email, weak password, expired token) is corrected in-place, and
    // reloading would discard what the user typed.
    function renderState(kind, text, extraEl, onRetry) {
      result.innerHTML = '';
      if (!text && !extraEl) return;
      const block = document.createElement('div');
      block.className = kind === 'error' ? 'auth-result--err' : 'auth-result--ok';
      block.textContent = text || '';
      if (extraEl) {
        const line = document.createElement('div');
        line.className = 'auth-linkline';
        line.appendChild(extraEl);
        block.appendChild(line);
      }
      if (kind === 'retry') {
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'cad-linkbtn';
        retry.textContent = 'Retry';
        // re-submit in place: a reload would discard what the user typed
        retry.addEventListener('click', () => (onRetry ? onRetry() : location.reload()));
        block.appendChild(retry);
      }
      result.appendChild(block);
    }

    const GENERIC = 'Couldn’t reach the server. ';

    function busy(form, on) {
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = on; // disabled stays legible; the label says what's happening
      btn.textContent = on ? 'Working…' : btn.dataset.label;
    }

    function wire(form, submitFn) {
      const btn = form.querySelector('button[type="submit"]');
      btn.dataset.label = btn.textContent;
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!validateForm(form.fields).ok) return; // gate on the ok flag — object is always truthy
        busy(form, true);
        renderState(null);
        try { await submitFn(new FormData(form)); }
        catch {
          // network failure — the only true Retry case; re-submit keeps typed input
          renderState('retry', GENERIC, null, () => form.requestSubmit());
        }
        finally { busy(form, false); }
      });
    }

    if (token) {
      // --- mode 2: choose a new password (pre-paint script already swapped forms) ---
      resetForm.fields = [{ input: resetForm.password, rule: 'password' }];
      attachBlurError(resetForm.password, 'password');
      wire(resetForm, async (data) => {
        const response = await fetch('/api/auth/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: String(data.get('password') ?? '') }),
        });
        const body = await response.json().catch(() => ({}));
        if (response.ok && body.ok) {
          resetForm.hidden = true;
          renderState('ok', 'Password updated. You can sign in with the new password now.');
        } else if (response.status === 400) {
          renderState('error', (body.detail || MSG.password));      // policy, mirrored
        } else if (response.status === 404) {
          renderState('error', (body.detail || 'That reset link has expired. Request a new one.'));
        } else {
          renderState('retry', GENERIC);                            // 5xx / malformed — retryable
        }
      });
    } else {
      // --- mode 1: request the reset link ---
      forgotForm.fields = [{ input: forgotForm.email, rule: 'email' }];
      attachBlurError(forgotForm.email, 'email');
      wire(forgotForm, async (data) => {
        const response = await fetch('/api/auth/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: String(data.get('email') ?? '').trim() }),
        });
        const body = await response.json().catch(() => ({}));
        const url = String(body.reset_url || '');
        if (response.ok && url.startsWith('/reset.html?token=')) {
          // link built with DOM APIs + contract-shape check: response data is never
          // parsed as HTML, and only this exact same-origin shape becomes clickable
          forgotForm.hidden = true;
          const link = document.createElement('a');
          link.className = 'auth-link';
          link.textContent = 'Open reset link';
          link.href = url;
          renderState('ok', 'Reset link generated (email isn’t wired in the demo):', link);
        } else if (response.status === 404) {
          renderState('error', (body.detail || 'No account uses that email.'));
        } else {
          renderState('retry', GENERIC);                            // 5xx / malformed — retryable
        }
      });
    }
  </script>
</body>
</html>
